[workspace]
members = ["crates/arora-scene", "crates/arora-scene-wasm"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/semio-ai/arora-scene"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

# The shared layer, by URL rather than by path: a path would encode where one
# machine happens to keep its checkouts, and would not resolve on any other.
# `Cargo.lock` pins the exact commit, so a build is reproducible even though
# the branch moves.
#
# To build against a local checkout instead — which is most of the time while
# both repos are moving together — put a `[patch]` in this repo's own
# `.cargo/config.toml`, which is deliberately not tracked. The README has the
# snippet.
#
# Its Bevy minor and the one below must agree. Bevy's derives produce concrete
# types, so a skew is a wall of trait errors rather than a version warning.
arora-visuals = { git = "https://github.com/semio-ai/arora-visuals", rev = "61eefb0" }

bevy = { version = "0.20", default-features = false }

# Bevy's PBR shaders bind each material texture and sampler to a `let` before
# sampling it. That needs WGSL's optional `texture_and_sampler_let` extension,
# which Safari's WebGPU lacks, so there `StandardMaterial` draws nothing. This
# copy of `bevy_pbr` 0.20.1 samples them by name instead; its README covers the
# change. Drop the patch once a Bevy release samples them without `let`s.
#
# A `[patch]` applies only in the workspace being built, which for the browser
# is this one: the wasm module is linked here.
[patch.crates-io]
bevy_pbr = { git = "https://github.com/semio-ai/bevy_pbr-safari-fixed", rev = "ae917f3" }

# Iterating: Bevy and every other dependency fully optimised, which is paid
# once, and this workspace's own code lightly, so a change rebuilds in
# seconds and the window still runs near release speed. A release build
# re-optimises the whole program on one core on every change, which takes
# minutes; it is for shipping and for measuring size, not for trying things.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

# The browser build. Size first, because it is downloaded: "z" is 14% smaller
# than "s" once compressed, and slower on its own, but binaryen's wasm-opt
# run over it afterwards (see build.sh) makes it both the smallest of the
# combinations measured and the fastest. wasm32-unknown-unknown already
# aborts on panic, so there is no unwinding to turn off.
[profile.web]
inherits = "release"
opt-level = "z"
