[package]
name = "arora-scene"
version = "0.0.0"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "A Semio robot scene in Bevy: the robot reading of RobotData, joints and their limit-aware controls, and the screen another renderer draws into."

[features]
default = ["cli"]
# The desktop command line: flag parsing, a window, and the two things only a
# desktop process can do — resolving assets from a directory and writing a PNG
# to disk. A wasm or editor host replaces exactly this, and takes the library.
# On Linux, winit builds only with a display backend chosen, and choosing one
# is the binary's call, so it is here rather than on the library. X11 also
# reaches Wayland desktops through XWayland; the feature does nothing on macOS
# or Windows.
cli = ["test_window", "dep:clap", "dep:env_logger", "bevy/x11"]
# The test window's tuning panel, built from Bevy's UI widgets. A host has
# controls of its own, so it leaves the widgets, and their input-focus
# plugins, out.
test_window = ["bevy/bevy_ui_widgets"]

[[bin]]
name = "arora-scene"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

# The GLB extension parse, and the asset semantics above it.
arora-visuals = { workspace = true, features = ["view", "view_gizmo", "camera_input"] }

# What the scene draws with, named one by one rather than through Bevy's
# collections, which each bring more than they say: `3d_bevy_render` brings
# animation, anti-aliasing, post-processing and the tonemapping and SMAA lookup
# tables (and the KTX2 and zstd decoders that read them); `picking` brings
# sprite picking, and with it the 2D sprite stack. The scene uses none of
# them: robots move by bound values, not animation clips; the camera draws
# untonemapped; and selection is an outline, not a post effect.
bevy = { workspace = true, features = [
  "default_app",
  "std",
  "multi_threaded",
  "bevy_winit",
  # glTF loading, PBR (which carries shadows) and the core pipeline. Morph
  # targets, for faces; mikktspace, for a glTF that asks for tangents.
  "bevy_render",
  "bevy_core_pipeline",
  "bevy_pbr",
  "bevy_light",
  "bevy_gltf",
  "bevy_mikktspace",
  "morph",
  "png",
  # A glTF spawns as a world asset.
  "bevy_world_serialization",
  "bevy_scene",
  # Pointer events, for picks and gizmo handles; the UI backend, for the view
  # gizmo's hover.
  "bevy_picking",
  "ui_picking",
  # The view gizmo and a control's label. `default_font` ships a face with the
  # binary, so no font asset has to sit beside the robot.
  "bevy_ui",
  "bevy_ui_render",
  "bevy_text",
  "default_font",
] }

clap = { version = "4", features = ["derive"], optional = true }
env_logger = { version = "0.11", optional = true }
